<!doctype html>
<html lang="es" data-theme="dark" data-palette="contapyme">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Usuarios</title>
<meta name="description" content="Usuarios, login y permisos del ecosistema">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/app.css">
<script type="module" src="./src/usrs-app.js"></script>
</head>
<body>
  <noscript>JavaScript requerido.</noscript>
  <!-- Layout común del kit iswc: barra (marca + navegación + sesión) y vista con scroll propio. -->
  <iswc-app-shell id="shell" brand="Usuarios" logo="mdi:account-group" home-label="Ir a Usuarios" toast="bottom-end">
    <iswc-app-nav id="nav" slot="nav" rows='[{"id":"seccion","label":"Secciones","value":"usuarios","tabs":[{"id":"usuarios","label":"Usuarios","icon":"mdi:account-multiple"}]}]'></iswc-app-nav>
    <!-- <iswc-session-menu id="sesion" slot="actions"> lo inserta src/usrs-app.js tras cargar el kit
         (workaround de un fallo del kit al actualizarse ya conectado; ver README). -->
    <iswc-theme-toggle slot="actions" scope="root"></iswc-theme-toggle>
    <usrs-app></usrs-app>
  </iswc-app-shell>
</body>
</html>
